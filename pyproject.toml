[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yfetch"
version = "3.0.0"
description = "YouTube downloader and video compilation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
yfetch = "yfetch.versions.yfetch_basic:main"
yfetch-basic = "yfetch.versions.yfetch_basic:main"
yfetch-pro = "yfetch.versions.yfetch_pro:main"
yfetch-unified = "yfetch.versions.yfetch_unified:main"
yfetch-auto-compiler = "yfetch.versions.auto_compiler:main"
yfetch-merge = "yfetch.versions.merge_tool:main"
yfetch-ai-finder = "yfetch.versions.ai_finder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
