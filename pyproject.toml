[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-tool"
version = "1.0.0"
description = "YouTube downloader and video compilation toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2025.1.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "filelock>=3.13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
ai = [
    "google-genai>=1.0.0",
]
gui = [
    "customtkinter>=5.2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
vt = "video_tool.versions.video_tool_basic:main"
vt-basic = "video_tool.versions.video_tool_basic:main"
vt-pro = "video_tool.versions.video_tool_pro:main"
vt-auto-compiler = "video_tool.versions.auto_compiler:main"
vt-merge = "video_tool.versions.merge_tool:main"
vt-api = "video_tool.api.cli:main"
vt-api-try = "video_tool.api.try_it:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
